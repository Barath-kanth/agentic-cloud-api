trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Plan
    displayName: Plan
    jobs:
      - job: Plan
        steps:
          - script: echo "Plan stage placeholder"
            displayName: Plan placeholder

  - stage: Build
    displayName: Build
    dependsOn: Plan
    jobs:
      - job: Build
        steps:
          - script: echo "Build stage placeholder"
            displayName: Build placeholder

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    jobs:
      - job: Deploy
        steps:
          - script: echo "Deploy stage placeholder - no deployment performed"
            displayName: Deploy placeholder

  - stage: Operate
    displayName: Operate
    dependsOn: Deploy
    jobs:
      - job: Operate
        steps:
          - script: echo "Operate stage placeholder"
            displayName: Operate placeholder
